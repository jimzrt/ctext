services:
  windows:
    image: docker.io/dockurr/windows
    container_name: ctext-windows-builder
    environment:
      VERSION: "core11"
      RAM_SIZE: "6G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      USERNAME: "Docker"
      PASSWORD: "admin"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./windows:/storage
      - ..:/shared
      - ./oem:/oem
    stop_grace_period: 2m
